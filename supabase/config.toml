# Configuración mínima del proyecto para el CLI de Supabase.
# El project_id real se toma de `supabase link` (no se escribe aquí).
project_id = "mi-tienda-express"

[api]
enabled = true
schemas = ["public"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.bot]
verify_jwt = false
